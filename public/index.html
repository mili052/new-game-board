<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d3f82">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="新游产品库">
  <link rel="manifest" href="./manifest.webmanifest?v=2">
  <link rel="icon" href="./icon-app.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-app.svg">
  <title>新游产品库</title>
  <link rel="stylesheet" href="./styles.css?v=15">
</head>
<body class="gate-locked">
  <div id="publicGate" class="public-gate">
    <div class="public-gate-card">
      <div class="public-gate-kicker">Access</div>
      <h2>请输入访问密码</h2>
      <p>输入正确密码后，才可以进入新游产品库。</p>
      <form id="publicGateForm" class="public-gate-form">
        <input id="publicGateInput" type="password" autocomplete="current-password" placeholder="访问密码">
        <button class="primary" type="submit">进入产品库</button>
      </form>
      <p id="publicGateMessage" class="message"></p>
    </div>
  </div>
  <aside class="radar-sidebar">
    <div class="radar-brand"><span class="radar-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle><path d="M12 1v3M12 20v3M1 12h3M20 12h3"></path></svg></span><span>新游产品雷达</span></div>
    <nav class="radar-nav" aria-label="主导航">
      <button class="radar-nav-item active" data-radar-nav="overview"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path><path d="M9 21v-6h6v6"></path></svg></span><span>首页总览</span></button>
      <button class="radar-nav-item radar-nav-parent" data-radar-toggle="ranking"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span><span>新进榜</span><b>⌃</b></button>
      <div class="radar-subnav" data-radar-group="ranking"><button data-radar-nav="ranking" data-radar-filter="微小"><i class="platform-icon wechat">微</i>微信小游戏</button><button data-radar-nav="ranking" data-radar-filter="抖小"><i class="platform-icon douyin">抖</i>抖音小游戏</button><button data-radar-nav="ranking" data-radar-filter="IOS"><i class="platform-icon ios">i</i>iOS</button><button data-radar-nav="ranking" data-radar-filter="TapTap"><i class="platform-icon taptap">T</i>TapTap</button></div>
      <button class="radar-nav-item radar-nav-parent" data-radar-toggle="testing"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8 12h8M7 9h.01M17 15h.01"></path><path d="M5 8 2 5M19 8l3-3M6 16h12a3 3 0 0 0 3-3v-1a5 5 0 0 0-5-5h-1l-2 2h-2L9 7H8a5 5 0 0 0-5 5v1a3 3 0 0 0 3 3Z"></path></svg></span><span>测试新游</span><b>⌃</b></button>
      <div class="radar-subnav" data-radar-group="testing"><button data-radar-nav="testing" data-radar-filter="测试"><i class="nav-dot"></i>本周测试</button><button data-radar-nav="testing" data-radar-filter="招募"><i class="nav-dot"></i>招募中</button><button data-radar-nav="testing" data-radar-filter="首测"><i class="nav-dot"></i>首测</button><button data-radar-nav="testing" data-radar-filter="二测"><i class="nav-dot"></i>二测+</button></div>
      <button class="radar-nav-item" data-radar-nav="launch"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span><span>即将上线</span></button>
      <button class="radar-nav-item" data-radar-nav="focus"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7L21 9.6l-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"></path></svg></span><span>重点观察</span></button>
      <button class="radar-nav-item radar-nav-parent" data-radar-toggle="library"><span class="nav-icon"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"></path></svg></span><span>产品库</span><b>⌃</b></button>
      <div class="radar-subnav" data-radar-group="library"><button data-radar-nav="library"><i class="tag-icon">◇</i>全部产品</button><button data-radar-nav="library" data-radar-filter="塔防"><i class="tag-icon">◇</i>塔防</button><button data-radar-nav="library" data-radar-filter="SLG"><i class="tag-icon">◇</i>SLG</button><button data-radar-nav="library" data-radar-filter="二合"><i class="tag-icon">◇</i>二合</button><button data-radar-nav="library" data-radar-filter="模拟经营"><i class="tag-icon">◇</i>模拟经营</button><button data-radar-nav="library" data-radar-filter="卡牌"><i class="tag-icon">◇</i>卡牌</button><button data-radar-nav="library" data-radar-filter="女性向"><i class="tag-icon">◇</i>女性向</button></div>
      <button class="radar-nav-item" data-radar-nav="market"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"></path><path d="M14 2v8h8"></path></svg></span><span>市场观察</span></button>
    </nav>
    <div class="radar-sidebar-foot">数据源：飞书产品库<br><span>仅展示已发布内容</span></div>
  </aside>
  <header class="topbar radar-topbar">
    <div class="brand-block"><div class="brand-eyebrow">PRODUCT RADAR</div><h1>新游产品雷达</h1><p class="brand-sub">更直观地查看测试、上榜、上线与重点观察产品</p></div>
    <div class="radar-top-actions"><label class="date-chip">日期 <input id="radarDate" type="date"></label><span class="updated-chip">数据更新：<b id="radarUpdatedAt">--</b></span><button class="icon-btn" id="adminButton" title="后台编辑" aria-label="后台编辑">⚙</button></div>
  </header>

  <main class="shell">
    <section class="filters radar-filters" id="libraryFilters" aria-label="筛选">
      <label>
        <span>时间</span>
        <select id="periodFilter"></select>
      </label>
      <label>
        <span>状态</span>
        <select id="statusFilter"></select>
      </label>
      <label class="search">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="产品 / 赛道 / 发行">
      </label>
    </section>

    <section id="productPage" class="product-page hidden"></section>
    <section id="boardRoot" class="board-root"></section>
  </main>

  <nav class="mobile-bottom-nav" id="mobileBottomNav" aria-label="底部导航">
    <button class="mobile-nav-item active" type="button" data-nav-target="home">
      <span class="mobile-nav-icon">⌂</span>
      <span class="mobile-nav-label">首页</span>
    </button>
    <button class="mobile-nav-item" type="button" data-nav-target="ranking">
      <span class="mobile-nav-icon">★</span>
      <span class="mobile-nav-label">上榜</span>
    </button>
    <button class="mobile-nav-item" type="button" data-nav-target="categories">
      <span class="mobile-nav-icon">▤</span>
      <span class="mobile-nav-label">品类</span>
    </button>
    <button class="mobile-nav-item" type="button" data-nav-target="search">
      <span class="mobile-nav-icon">⌕</span>
      <span class="mobile-nav-label">搜索</span>
    </button>
  </nav>

  <dialog id="loginDialog" class="modal">
    <form method="dialog" class="login-card" id="loginForm">
      <h2>后台登录</h2>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="管理员密码">
      <div class="modal-actions">
        <button class="ghost" value="cancel">取消</button>
        <button class="primary" id="loginSubmit" value="default">进入</button>
      </div>
      <p id="loginMessage" class="message"></p>
    </form>
  </dialog>

  <aside id="adminPanel" class="admin-panel" aria-hidden="true">
    <div class="admin-head">
      <div>
        <span class="kicker">Admin</span>
        <h2>编辑看板</h2>
      </div>
      <button class="icon-btn" id="closeAdmin" title="关闭" aria-label="关闭">✕</button>
    </div>

    <div class="admin-body">
      <section class="editor-block">
        <div class="inline-title">
          <h3>看板</h3>
          <button class="small" id="newBoardButton">新建</button>
        </div>
        <label>选择看板<select id="boardSelect"></select></label>
        <label>标题<input id="boardTitle"></label>
        <label>周期<input id="boardPeriod" placeholder="2026年4月第3周"></label>
        <label>日期<input id="boardDate" type="date"></label>
        <label>摘要<textarea id="boardSummary" rows="4"></textarea></label>
        <label>指标<input id="boardMetrics" placeholder="用 / 分隔，例如 收录24款 / 畅销5款"></label>
      </section>

      <section class="editor-block">
        <div class="inline-title">
          <h3>AI 快速录入</h3>
          <button class="small" id="aiParseButton" type="button">AI整理</button>
        </div>
        <label>粘贴新游信息<textarea id="aiInput" rows="7" placeholder="把公众号、群聊、商店页、表格里的新游信息直接粘贴到这里。AI 会生成草稿，发布前仍需你确认。"></textarea></label>
        <label class="file-label wide">兼容上传截图 / 图片<input id="aiImageInput" type="file" accept="image/*"></label>
        <div id="aiImagePreview" class="preview"></div>
        <p id="aiMessage" class="message neutral"></p>
      </section>

      <section class="editor-block">
        <div class="inline-title">
          <h3>产品</h3>
          <button class="small" id="newProductButton">新增产品</button>
        </div>
        <label>选择产品<select id="productSelect"></select></label>
        <div class="grid-2">
          <label>名称<input id="productName"></label>
          <label>赛道<input id="productGenre"></label>
          <label>状态<input id="productStatus" placeholder="畅销 / 将测 / 测试"></label>
          <label>排序<input id="productRank" type="number" min="0"></label>
        </div>
        <div class="grid-2">
          <label>研发<input id="productDeveloper"></label>
          <label>发行<input id="productPublisher"></label>
        </div>
        <label>公开节点<input id="productNode"></label>
        <label>趋势判断<textarea id="productJudgement" rows="3"></textarea></label>
        <label class="checkline"><input id="productFocus" type="checkbox"> 重点关注</label>

        <div class="asset-row">
          <label class="file-label">图标 / 封面<input id="coverInput" type="file" accept="image/*"></label>
          <button class="small danger" id="removeProductButton">删除产品</button>
        </div>
        <div id="coverPreview" class="preview"></div>

        <label class="file-label wide">追加游戏截图<input id="screensInput" type="file" accept="image/*" multiple></label>
        <div id="screensPreview" class="screenshot-strip"></div>
      </section>
    </div>

    <div class="admin-actions">
      <button class="danger ghost" id="deleteBoardButton">删除看板</button>
      <button class="primary" id="saveButton">保存更新</button>
    </div>
  </aside>

  <script src="./app.js?v=15"></script>
</body>
</html>
